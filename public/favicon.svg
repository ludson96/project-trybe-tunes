<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>

    <!-- Neon Brand Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Subtle Border -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="#27272a" stroke-width="8" fill="none" />

  <!-- Outer Vinyl Groove Accent -->
  <circle cx="256" cy="256" r="190" stroke="#1f2937" stroke-width="4" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Modern Music Notes & Equalizer Core -->
  <g filter="url(#glow)">
    <!-- Primary Note Stem 1 -->
    <rect x="210" y="140" width="24" height="170" rx="12" fill="url(#neon-grad)" />
    
    <!-- Primary Note Stem 2 -->
    <rect x="310" y="110" width="24" height="170" rx="12" fill="url(#neon-grad)" />
    
    <!-- Connected Top Beam -->
    <path d="M 210 160 C 260 140, 275 130, 334 110 L 334 145 C 280 162, 260 172, 210 192 Z" fill="url(#neon-grad)" />
    
    <!-- Left Note Head -->
    <circle cx="178" cy="300" r="42" fill="url(#neon-grad)" />
    
    <!-- Right Note Head -->
    <circle cx="278" cy="270" r="42" fill="url(#neon-grad)" />

    <!-- Waveform Frequency Bars (Bottom Accent) -->
    <rect x="140" y="380" width="16" height="34" rx="8" fill="#1ed760" opacity="0.4" />
    <rect x="172" y="365" width="16" height="49" rx="8" fill="#1ed760" opacity="0.7" />
    <rect x="204" y="350" width="16" height="64" rx="8" fill="#22c55e" />
    <rect x="236" y="360" width="16" height="54" rx="8" fill="#1ed760" />
    <rect x="268" y="340" width="16" height="74" rx="8" fill="#10b981" />
    <rect x="300" y="355" width="16" height="59" rx="8" fill="#1ed760" />
    <rect x="332" y="370" width="16" height="44" rx="8" fill="#1ed760" opacity="0.7" />
    <rect x="364" y="382" width="16" height="32" rx="8" fill="#1ed760" opacity="0.4" />
  </g>
</svg>
